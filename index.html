<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Movie Library</title>
  <style>
    :root {
      --bg: #0f1117;
      --card: #181b24;
      --card-hover: #202431;
      --text: #f4f4f5;
      --muted: #a1a1aa;
      --accent: #f5c518;
      --link: #7dd3fc;
      --border: rgba(255,255,255,0.08);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: radial-gradient(circle at top, #1b2030 0%, var(--bg) 45%);
      color: var(--text);
      min-height: 100vh;
    }

    header {
      padding: 28px 20px 18px;
      max-width: 1200px;
      margin: 0 auto;
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(28px, 5vw, 44px);
      letter-spacing: -0.04em;
    }

    .subtitle {
      color: var(--muted);
      margin: 0;
      font-size: 15px;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 20px 22px;
    }

    input, select, button {
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.06);
      color: var(--text);
      border-radius: 12px;
      padding: 11px 13px;
      font-size: 14px;
      outline: none;
    }

    input {
      flex: 1 1 240px;
      min-width: 0;
    }

    select, button {
      cursor: pointer;
    }

    button:hover, select:hover, input:focus {
      background: rgba(255,255,255,0.10);
    }

    main {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 20px 36px;
    }

    .meta {
      color: var(--muted);
      font-size: 14px;
      margin: 0 0 16px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
      gap: 16px;
    }

    .card {
      background: linear-gradient(180deg, rgba(255,255,255,0.04), rgba(255,255,255,0.02)), var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      overflow: hidden;
      transition: transform 0.16s ease, background 0.16s ease, border-color 0.16s ease;
      min-height: 100%;
    }

    .card:hover {
      transform: translateY(-3px);
      background: var(--card-hover);
      border-color: rgba(245,197,24,0.35);
    }

    .poster {
      aspect-ratio: 2 / 3;
      background: #272a36;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      font-size: 13px;
      text-align: center;
      overflow: hidden;
    }

    .poster img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .content {
      padding: 12px;
    }

    .title {
      margin: 0 0 5px;
      font-size: 15px;
      line-height: 1.25;
      font-weight: 700;
    }

    .year {
      color: var(--muted);
      font-size: 13px;
    }

    .rating {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      color: var(--accent);
      font-weight: 700;
      margin-top: 9px;
      font-size: 14px;
    }

    .links {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }

    .links a {
      flex: 1;
      text-align: center;
      color: var(--text);
      text-decoration: none;
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.06);
      border-radius: 10px;
      padding: 8px 8px;
      font-size: 13px;
    }

    .links a:hover {
      background: rgba(255,255,255,0.12);
    }

    .notice {
      margin: 18px 0 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }

    @media (max-width: 520px) {
      header { padding-top: 22px; }
      .toolbar { align-items: stretch; }
      select, button { flex: 1 1 calc(50% - 10px); }
      .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
      .content { padding: 10px; }
      .links { flex-direction: column; }
    }
  </style>
</head>
<body>
  <header>
    <h1 id="pageTitle">🎬 Movie Library</h1>
    <p class="subtitle" id="pageSubtitle">SSD movie index with IMDb links, posters, trailers and sorting.</p>
  </header>

  <section class="toolbar">
    <input id="search" type="search" placeholder="Search movie..." />
    <select id="sort">
      <option value="title-asc">Title A-Z</option>
      <option value="title-desc">Title Z-A</option>
      <option value="year-asc">Year ↑</option>
      <option value="year-desc">Year ↓</option>
      <option value="rating-desc">IMDb rating ↓</option>
      <option value="rating-asc">IMDb rating ↑</option>
    </select>
    <button id="refresh">Refresh rating</button>
  </section>

  <main>
    <p class="meta" id="count"></p>
    <section class="grid" id="grid"></section>
    <p class="notice">
      Posters are loaded from the local <code>posters/</code> folder using each IMDb ID as filename, for example <code>posters/tt0095016.jpg</code>. IMDb ratings can still be refreshed through OMDb if an API key is added.
    </p>
  </main>

  <script>
    // 1) Optional: get a free OMDb API key from https://www.omdbapi.com/apikey.aspx
    // 2) Replace this value, then commit the file again to GitHub Pages.
    // Note: static sites expose this key in browser source. For personal use, this is usually acceptable.
    const OMDB_API_KEY = "";

    const LISTS = {
      "ssd-1": { name: "SSD 1", file: "movies/ssd-1.json" },
      "ssd-2": { name: "SSD 2", file: "movies/ssd-2.json" },
      "ssd-3": { name: "SSD 3", file: "movies/ssd-3.json" }
    };

    let movies = [];
    let currentListKey = new URLSearchParams(window.location.search).get("list") || "ssd-1";

    async function loadMovies() {
      if (!LISTS[currentListKey]) currentListKey = "ssd-1";

      const list = LISTS[currentListKey];
      document.getElementById("pageTitle").textContent = `🎬 ${list.name}`;
      document.getElementById("pageSubtitle").textContent = `Movie index for ${list.name}. IMDb links, posters, trailers and sorting.`;

      try {
        const response = await fetch(list.file, { cache: "no-store" });
        if (!response.ok) throw new Error(`Could not load ${list.file}`);
        movies = await response.json();
        render();
      } catch (error) {
        console.error(error);
        grid.innerHTML = `<p>Could not load movie list: <code>${list.file}</code></p>`;
        count.textContent = "";
      }
    }

    const grid = document.getElementById("grid");
    const count = document.getElementById("count");
    const sortSelect = document.getElementById("sort");
    const searchInput = document.getElementById("search");
    const refreshButton = document.getElementById("refresh");

    const CACHE_KEY = "movieMetadata.v1";
    let metadata = {};

    function imdbUrl(movie) {
      return `https://www.imdb.com/title/${movie.imdbId}/`;
    }

    function trailerUrl(movie) {
      return `https://www.youtube.com/results?search_query=${encodeURIComponent(movie.title + " " + movie.year + " official trailer")}`;
    }

    function getPoster(movie) {
      return `posters/${movie.imdbId}.jpg`;
    }

    function getRating(movie) {
      const rating = parseFloat(movie.imdbRating);
      return Number.isFinite(rating) ? rating : null;
    }

    function sortedAndFilteredMovies() {
      const query = searchInput.value.trim().toLowerCase();
      const sort = sortSelect.value;

      return [...movies]
        .filter(movie => movie.title.toLowerCase().includes(query) || String(movie.year).includes(query))
        .sort((a, b) => {
          const ratingA = getRating(a) ?? -1;
          const ratingB = getRating(b) ?? -1;

          switch (sort) {
            case "title-desc": return b.title.localeCompare(a.title);
            case "year-asc": return a.year - b.year || a.title.localeCompare(b.title);
            case "year-desc": return b.year - a.year || a.title.localeCompare(b.title);
            case "rating-desc": return ratingB - ratingA || a.title.localeCompare(b.title);
            case "rating-asc": return ratingA - ratingB || a.title.localeCompare(b.title);
            case "title-asc":
            default: return a.title.localeCompare(b.title);
          }
        });
    }

    function render() {
      const list = sortedAndFilteredMovies();
      count.textContent = `${list.length} movie${list.length === 1 ? "" : "s"}`;

      grid.innerHTML = list.map(movie => {
        const poster = getPoster(movie);
        const rating = getRating(movie);

        return `
          <article class="card">
            <div class="poster">
              <img loading="lazy" src="${poster}" alt="${escapeHtml(movie.title)} poster" onerror="this.remove(); this.parentElement.innerHTML='<span>No poster<br>${escapeHtml(movie.title).replace(/'/g, '&#039;')}</span>';" />
            </div>
            <div class="content">
              <h2 class="title">${escapeHtml(movie.title)}</h2>
              <div class="year">${movie.year}</div>
              <div class="rating">★ ${rating ?? "—"}</div>
              <div class="links">
                <a href="${imdbUrl(movie)}" target="_blank" rel="noopener">IMDb</a>
                <a href="${trailerUrl(movie)}" target="_blank" rel="noopener" title="YouTube trailer">▶ Trailer</a>
              </div>
            </div>
          </article>
        `;
      }).join("");
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>'"]/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        "'": "&#039;",
        '"': "&quot;"
      }[char]));
    }

    async function refreshMetadata() {
      alert("Metadata is updated from GitHub Actions: Actions → Update movie metadata → Run workflow.");
    }

    sortSelect.addEventListener("change", render);
    searchInput.addEventListener("input", render);
    refreshButton.addEventListener("click", refreshMetadata);

    loadMovies();
  </script>
</body>
</html>
