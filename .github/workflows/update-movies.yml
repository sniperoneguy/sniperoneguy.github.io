name: Update movie metadata

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update movies metadata
        env:
          OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
        run: python scripts/update_movies.py

      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add movies/ posters/ index.html scripts/update_movies.py
          git commit -m "Update movie metadata" || echo "No changes"
          git push
